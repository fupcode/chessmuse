[project]
name = "chessmuse"
version = "0.1.0"
description = "棋妙：中国象棋复盘与解说"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cchess==1.25.5",
    "edge-tts>=7.3.1",
    "httpx>=0.28.1",
    "mutagen>=1.48.1",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project.scripts]
chessmuse = "chessmuse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chessmuse = ["static/*", "data/*.json", "data/audio/*.wav", "data/audio/*.mp3", "scripts/*.ps1"]

[tool.pytest.ini_options]
cache_dir = ".cache/pytest_cache"
addopts = "--basetemp=.cache/pytest-tmp"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
