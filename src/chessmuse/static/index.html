<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>棋妙 ChessMuse · 复盘演示</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header><a class="brand" href="/">棋妙 <span>CHESSMUSE</span></a><span class="edition">中国象棋 · 复盘讲解</span></header>
  <main>
    <div class="intro"><p class="eyebrow">一盘棋，一步步看懂</p><h1 id="title">选择一局棋开始</h1><p id="description">导入棋谱，让棋妙边讲边走</p></div>
    <section class="game-picker" aria-label="导入棋谱">
      <div class="import-controls">
        <label for="example-select">示例棋谱</label>
        <select id="example-select" disabled><option>正在加载示例…</option></select>
        <button id="load-example" disabled>打开示例</button>
        <label class="file-button" for="game-file">导入棋谱<input id="game-file" type="file" accept=".json,application/json" disabled></label>
        <a id="download-example" href="#" download>下载示例 JSON</a>
      </div>
      <p class="import-hint">支持 JSON 棋谱，moves 填写 ICCS 走法，如 h2e2。最多 200 个半回合；标准开局。首次生成需要网络，已有有效语音将直接复用。</p>
      <div id="import-progress-panel" class="import-progress" hidden>
        <div class="import-progress-label"><span id="import-message" role="status">准备导入</span><span id="import-percent">0%</span></div>
        <div id="import-track" class="import-track" role="progressbar" aria-label="棋谱准备进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="import-fill"></div></div>
      </div>
    </section>
    <div class="layout">
      <section class="board-panel" aria-label="棋盘和播放控制">
        <div class="board-meta"><span id="line">实战主线</span><span id="turn">红方先行</span></div>
        <svg id="board" viewBox="0 0 540 600" role="img" aria-label="中国象棋棋盘，红方在下"></svg>
        <div id="move-label" aria-live="polite">初始局面</div>
        <div class="transport">
          <button id="replay" title="从头重播" disabled>↺ 重播</button>
          <button id="play" class="primary" disabled>播放解说</button>
          <button id="mainline" disabled>回到主线</button>
        </div>
        <label class="progress-label" for="progress"><span>播放进度</span><span id="counter">0 / 0</span></label>
        <input id="progress" type="range" min="0" max="0" value="0" disabled>
        <div class="playback-meta"><label><input id="voice" type="checkbox" checked> <span id="voice-label">中文语音</span></label><span id="status" role="status">正在加载</span></div>
      </section>
      <aside>
        <section class="chapters"><h2>关键节点 <span>点击跳转</span></h2><nav id="chapters" aria-label="关键节点"></nav></section>
        <section class="commentary"><h2>随棋讲解 <span>段落同步</span></h2><div id="captions" tabindex="0" aria-label="解说字幕"></div></section>
        <p class="note" id="evidence-note">讲解与推演会随所选棋谱载入。</p>
      </aside>
    </div>
  </main>
  <footer>棋妙 · 从具体变化里理解每一步</footer>
</body>
</html>
